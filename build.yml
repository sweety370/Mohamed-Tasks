
name: Build Mohamed Tasks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android,linux --project-name=mohamed_tasks .

      - name: Install Dart packages
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Linux app
        run: flutter build linux --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mohamed-tasks-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: mohamed-tasks-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
